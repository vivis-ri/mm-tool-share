<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM-tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/brand.css" />
  <link rel="stylesheet" href="css/diary.css" />
  <link rel="stylesheet" href="css/companies.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/settings.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />

  <style id="mm-gate-css">
    #mm-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
      background:#2A2B29;background:radial-gradient(1200px 600px at 50% -10%,#3a3b38,#232421);font-family:"Pretendard","Malgun Gothic",sans-serif;}
    #mm-gate .gate-card{width:min(92vw,360px);background:#fff;border-radius:18px;padding:30px 26px 26px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;}
    #mm-gate .gate-mark{width:46px;height:46px;margin:0 auto 14px;border-radius:12px;background:#FA8619;color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
    #mm-gate h1{font-size:18px;margin:0 0 4px;color:#2A2B29;}
    #mm-gate p{font-size:12.5px;color:#8b8c84;margin:0 0 18px;line-height:1.5;}
    #mm-gate input{width:100%;padding:12px 14px;border:1px solid #d9d3c5;border-radius:10px;font-size:15px;text-align:center;letter-spacing:1px;color:#2A2B29;}
    #mm-gate input:focus{outline:none;border-color:#FA8619;box-shadow:0 0 0 3px #ffe6cc;}
    #mm-gate button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#FA8619;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;}
    #mm-gate button:hover{background:#e5780f;}
    #mm-gate .gate-err{min-height:16px;margin-top:10px;font-size:12px;color:#e5484d;font-weight:600;}
    #mm-gate .gate-foot{margin-top:16px;font-size:11px;color:#b0aca0;}
    body.gated{overflow:hidden;}
  </style>
</head>
<body>

  <div id="mm-gate">
    <div class="gate-card">
      <div class="gate-mark">MM</div>
      <h1>프로젝트 진행현황</h1>
      <p>대표님 열람용 페이지입니다.<br>전달받은 암호를 입력해 주세요.</p>
      <input id="mm-gate-pass" type="password" inputmode="text" autocomplete="off" placeholder="열람 암호" />
      <button id="mm-gate-go">열기</button>
      <div class="gate-err" id="mm-gate-err"></div>
      <div class="gate-foot">🔒 데이터는 암호로 보호되어 있습니다</div>
    </div>
  </div>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">MM</div>
        <div class="brand-text">
          <strong>MM-tool</strong>
          <span>업무 · 프로젝트 관리</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="diary">
          <span class="ic">🗒️</span><span>업무일지</span>
        </button>
        <button class="nav-item" data-view="companies">
          <span class="ic">🏢</span><span>프로젝트 현황</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="ic">⚙️</span><span>항목 설정</span>
        </button>
      </nav>

      <div class="nav-co" id="nav-co">
        <button class="nav-co-head" id="nav-co-toggle">
          <span class="caret">▾</span><span>업체 바로가기</span>
        </button>
        <div class="nav-co-list" id="nav-co-list"></div>
      </div>

      <div class="sidebar-foot">
        <button id="btn-panel" class="ghost-btn">🪟 미니 패널</button>
        <div class="mode-badge" id="mode-badge">로컬 저장</div>
      </div>
    </aside>

    <!-- 본문 -->
    <main class="content">
      <section id="view-diary" class="view active"></section>
      <section id="view-companies" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <!-- 모달 컨테이너 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Supabase 클라이언트(클라우드 연결 시 사용) -->
  <!-- 엑셀 일괄 추가용(SheetJS) -->
  <!-- 설정 & 데이터 계층 -->
  <script src="config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/dragsort.js"></script>
  <!-- 화면 모듈 -->
  <script src="js/ui.js"></script>
  <script src="js/diary.js"></script>
  <script src="js/companies.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>

  <script>
  (function(){
    function fromB64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
    async function decrypt(enc,pass){
      var salt=fromB64(enc.salt),iv=fromB64(enc.iv),ct=fromB64(enc.ct);
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:enc.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
      return new TextDecoder().decode(buf);
    }
    document.body.classList.add('gated');
    var inp=document.getElementById('mm-gate-pass'),btn=document.getElementById('mm-gate-go'),err=document.getElementById('mm-gate-err');
    async function tryOpen(){
      err.textContent=''; btn.disabled=true; btn.textContent='여는 중...';
      try{
        var json=await decrypt(window.MM_ENC, inp.value.trim());
        window.MM_SNAPSHOT=JSON.parse(json);
        var g=document.getElementById('mm-gate'); if(g)g.remove();
        document.body.classList.remove('gated');
        if(typeof window.__mmSnapshotReady==='function') window.__mmSnapshotReady();
      }catch(e){
        btn.disabled=false; btn.textContent='열기';
        err.textContent='암호가 올바르지 않습니다.'; inp.select();
      }
    }
    btn.addEventListener('click',tryOpen);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')tryOpen();});
    inp.focus();
  })();
  </script>
</body>
</html>
